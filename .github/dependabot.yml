version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # fix: runtime updates ship a patch release; dev-only updates do not release.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    ignore:
      # Node types must match engines.node (>=22), not the newest Node major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Starts the server without credentials; fails if a tool change was not
      # synced into manifest.json (run `npm run sync-tools` and commit).
      - name: Tool list in sync
        run: |
          npm run sync-tools
          git diff --exit-code -- manifest.json
      - name: Bundle builds and validates
        if: matrix.node == 24
        run: npm run bundle
